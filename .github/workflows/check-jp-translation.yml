# <Language> up to date: on a translation pull request (translations/<locale>
# → vnext, translate-jp-docs.yml), every page of that language is the
# translation of the current English, or a person's edit of one. Fails, and
# lists the pages, when:
#   - an English page is newer than its translation (the Translate docs run has
#     not got to it, stopped at its token cap, or could not write it);
#   - a translated page someone edited by hand has an English change to carry
#     over (the run's comment on the pull request shows the English diff);
#   - a correction in translation/memory/<locale>.human.json is not on its pages
#     yet (the next run applies it, from memory).
# The tool's own `--check`, a dry run: no model, no writes. Runs on every commit
# to the pull request, the reviewers' and the Translation Manager's included.
#
# The language comes from the pull request's branch, matched against a fixed
# list (translations/ja, translations/es, translations/pt-BR, translations/ko);
# any other branch runs nothing. The check is named for the language
# ("Japanese up to date", "Spanish up to date", …).
#
# The other checks the pull request needs and that use no secrets already run
# on it: lint.yml (`npm run check:llms-metadata`, which reads English and
# Japanese), check-relative-links.yml (it generates English and Japanese), and
# ci-jp.yml (the build of the changed project in the pull request's language).
#
# Not a required check (translation/README.md, "Setting it up"). Runs only
# once the repository variable TRANSLATE_ENABLED is true.
#
# SECURITY. IgniteUI/translation-tools is private, so reading it needs the App
# key, and so this runs on `pull_request_target`: THIS file as it is on vnext,
# never the pull request's copy. It runs only for the four translation branches
# of this repo, and only the tool, pinned (TOOLS_REF). The branch name is never
# put in a script: it is passed through the environment and compared with the
# four known names. The pull request is checked out as files, without
# credentials, and before the tool runs a check refuses a pull request that
# changes anything outside its language's content folder and that language's
# own files in translation/: the one file of this repo the tool executes
# (docs/angular/src/scripts/grid-configs.mjs) is then vnext's, reviewed. No npm
# install or build of the pull request happens here.

name: Check docs translations

on:
  pull_request_target:
    branches: [vnext]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: check-docs-translation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TOOLS_REPO: IgniteUI/translation-tools
  # The same commit as TOOLS_REF in translate-jp-docs.yml; move both together.
  TOOLS_REF: SET-ME-TO-THE-TRANSLATION-TOOLS-MERGE-COMMIT

jobs:
  # The pull request's language, from its branch: one of the four, or nothing.
  # No checkout, no secrets.
  language:
    if: >-
      vars.TRANSLATE_ENABLED == 'true' &&
      startsWith(github.event.pull_request.head.ref, 'translations/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      locale: ${{ steps.lang.outputs.locale }}
      folder: ${{ steps.lang.outputs.folder }}
      name: ${{ steps.lang.outputs.name }}
      glossary: ${{ steps.lang.outputs.glossary }}
      allowed: ${{ steps.lang.outputs.allowed }}
    steps:
      - name: The language of the branch
        id: lang
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          case "$HEAD_REF" in
            translations/ja)    locale=ja    folder=jp    name=Japanese               glossary=docs/translation/jp-component-names.md ;;
            translations/es)    locale=es    folder=es    name=Spanish                glossary= ;;
            translations/pt-BR) locale=pt-BR folder=pt-BR name='Brazilian Portuguese' glossary= ;;
            translations/ko)    locale=ko    folder=kr    name=Korean                 glossary= ;;
            *) echo "Not a translation branch: $(printf '%q' "$HEAD_REF"). Nothing to check."; exit 0 ;;
          esac
          {
            echo "locale=$locale"
            echo "folder=$folder"
            echo "name=$name"
            echo "glossary=$glossary"
            # What the pull request may change: the language's content folder
            # and its own files in translation/ (as in translate-jp-docs.yml).
            echo "allowed=^(docs/(angular|xplat)/src/content/$folder/|translation/(memory/$locale(\\.human)?\\.json|manifest/$locale/.+|scope/$locale\\.json|reports/$locale-[^/]+)\$)"
          } >> "$GITHUB_OUTPUT"
          echo "Language: $locale ($folder)"

  up-to-date:
    name: ${{ needs.language.outputs.name }} up to date
    needs: language
    if: needs.language.outputs.locale != ''
    runs-on: ubuntu-latest
    environment: intl-translate
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      LOCALE: ${{ needs.language.outputs.locale }}
      FOLDER: ${{ needs.language.outputs.folder }}
      LANG_NAME: ${{ needs.language.outputs.name }}
      GLOSSARY: ${{ needs.language.outputs.glossary }}
      ALLOWED: ${{ needs.language.outputs.allowed }}
    steps:
      - name: The translation tool is pinned
        run: |
          if ! [[ "$TOOLS_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::TOOLS_REF in this workflow must be the full commit SHA of IgniteUI/translation-tools (the same as in translate-jp-docs.yml). It is '$TOOLS_REF'."
            exit 1
          fi

      - name: App token (read the translation tool)
        id: tools-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TRANSLATE_APP_ID }}
          private-key: ${{ secrets.TRANSLATE_APP_KEY }}
          owner: IgniteUI
          repositories: translation-tools
          permission-contents: read

      - name: Check out the translation tool (pinned)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TOOLS_REPO }}
          ref: ${{ env.TOOLS_REF }}
          path: tools
          token: ${{ steps.tools-app.outputs.token }}
          persist-credentials: false

      # The pull request's own head, the commit people review (not the merge with
      # vnext). Full history: the guard below compares it with vnext.
      - name: Check out the pull request (files only)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: site
          fetch-depth: 0
          persist-credentials: false

      - name: Only the language's content and its translation/ files changed
        working-directory: site
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          [ -n "$ALLOWED" ] || { echo "::error::no ALLOWED pattern"; exit 1; }
          base=$(git merge-base "$BASE_SHA" HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          # Outside ALLOWED, or with a . or .. segment (git never lists one).
          outside=$(printf '%s\n' "$changed" | grep -v '^$' | grep -Ev "$ALLOWED" || true
                    printf '%s\n' "$changed" | grep -E '(^|/)\.\.?(/|$)' || true)
          if [ -n "$outside" ]; then
            echo "::error::The translation pull request changes files outside the $LANG_NAME content and its own files in translation/; this check runs nothing on it. Move those changes to a pull request of their own:"
            echo "$outside"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the translation tool
        run: npm ci --prefix tools --omit=dev --ignore-scripts

      # The same command as the Translate run, with --check: exits 1 when work is
      # left. For each project that has the language (its content folder and its
      # manifests), as the Translate run.
      - name: Every English change is translated
        working-directory: site
        run: |
          fail=0
          for p in angular xplat; do
            if ! [ -d "docs/$p/src/content/$FOLDER" ] || ! [ -d "translation/manifest/$LOCALE/$p" ]; then
              echo "$p: no $LANG_NAME"; continue
            fi
            args=(--en "docs/$p" --out "docs/$p/src/content"
                  --docs "$FOLDER" --locale "$LOCALE" --source en
                  --scope "translation/scope/$LOCALE.json"
                  --memory "translation/memory/$LOCALE.json"
                  --fixes "translation/memory/$LOCALE.human.json"
                  --manifest-dir "translation/manifest/$LOCALE/$p")
            [ -n "$GLOSSARY" ] && args+=(--glossary "$GLOSSARY")
            node "$GITHUB_WORKSPACE/tools/translate.mjs" "${args[@]}" \
              --check > "$RUNNER_TEMP/check-$p.log" 2>&1 || {
                fail=1
                echo "## $p"
                # The pages left, or (the tool itself failed) the end of its output.
                if grep -q 'not translated for the current English' "$RUNNER_TEMP/check-$p.log"; then
                  sed -n '/not translated for the current English/,$p' "$RUNNER_TEMP/check-$p.log"
                else tail -20 "$RUNNER_TEMP/check-$p.log"; fi
              }
          done
          if [ "$fail" = 1 ]; then
            echo "::error::Some $LANG_NAME pages are not the translation of the current English. Run Translate docs for $LOCALE (Actions → Run workflow), or for a page under \"edited by a person\", carry the English change over by hand."
            exit 1
          fi
