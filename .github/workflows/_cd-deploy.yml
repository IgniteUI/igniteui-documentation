name: _CD Deploy (reusable)

on:
  workflow_call:
    inputs:
      platform:
        description: 'Platform to build (angular, react, wc, blazor, winui, uno, jquery)'
        required: true
        type: string
      locale:
        description: 'Locale to build (en or jp)'
        required: true
        type: string
      target_ref:
        description: 'Git ref to checkout'
        required: true
        type: string
    secrets:
      CLASSIC_PAT_GITHUB:
        required: true

permissions:
  contents: read

env:
  BUILD_TYPE: ${{ (inputs.target_ref == 'master' || inputs.target_ref == 'refs/heads/master') && 'production' || 'staging' }}

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
          clean: true
          fetch-tags: true
          fetch-depth: 0

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Checkout Uno sample routes for WinUI and Uno docs
        if: inputs.platform == 'winui' || inputs.platform == 'uno'
        uses: actions/checkout@v7
        with:
          repository: Infragistics/uno-samples
          ref: ${{ env.BUILD_TYPE == 'production' && 'main' || 'vnext' }}
          path: .uno-samples
          token: ${{ secrets.CLASSIC_PAT_GITHUB }}

      - name: Select Uno sample registry
        if: inputs.platform == 'winui' || inputs.platform == 'uno'
        run: echo "UNO_SAMPLES_REGISTRY=$GITHUB_WORKSPACE/.uno-samples/browser/SamplesBrowser/SampleRegistry.cs" >> "$GITHUB_ENV"

      - name: Check Uno embed generation
        if: inputs.platform == 'winui' || inputs.platform == 'uno'
        run: node --test docs/xplat/scripts/lib/uno-samples.test.mjs

      - name: Install dependencies
        run: npm ci

      # Generating a topic emits its json-snippet fences, which the product's code generating
      # renderer does — it ships in igniteui-webcomponents-core, so this needs nothing but npm.
      # Angular needs it too: its build generates the topics it takes from xplat first.
      - name: Build the snippet emitter
        working-directory: docs/xplat/scripts/snippet-emitter
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build Documentation for ${{ inputs.platform }} (${{ inputs.locale }})
        run: npm run build:${{ env.BUILD_TYPE }}:${{ inputs.platform }}:${{ inputs.locale }}

      - name: Validate Uno sample embeds
        if: inputs.platform == 'winui' || inputs.platform == 'uno'
        env:
          PLATFORM: ${{ inputs.platform }}
          LOCALE: ${{ inputs.locale }}
        run: |
          DIST_DIR="dist/$PLATFORM$([[ "$LOCALE" == 'en' ]] && echo '' || echo "-$LOCALE")"
          node scripts/check-uno-sample-links.mjs --site="$DIST_DIR" --environment="$BUILD_TYPE" --registry="$UNO_SAMPLES_REGISTRY"

      - name: Package build
        run: |
          LOCALE="${{ inputs.locale }}"
          DIST_DIR="dist/${{ inputs.platform }}$([[ "$LOCALE" == 'en' ]] && echo '' || echo "-$LOCALE")"
          cd "$DIST_DIR"
          zip -r ../../${{ env.BUILD_TYPE }}_${{ inputs.platform }}_${{ inputs.locale }}.zip .
          cd ../..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: igniteui-docs-${{ inputs.platform }}-${{ inputs.locale }}
          path: ${{ env.BUILD_TYPE }}_${{ inputs.platform }}_${{ inputs.locale }}.zip
          retention-days: 1

      - name: Trigger Deploy Workflow in IgniteUI Actions
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.CLASSIC_PAT_GITHUB }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'IgniteUI',
              repo: 'igniteui-actions',
              event_type: 'igniteui-documentation-cd',
              client_payload: {
                calling_branch: "${{ inputs.target_ref }}",
                environment: "${{ env.BUILD_TYPE }}",
                artifact_name: "igniteui-docs-${{ inputs.platform }}-${{ inputs.locale }}",
                base_href: "${{ inputs.platform == 'wc' && 'webcomponents' || inputs.platform == 'uno' && 'uno-platform' || inputs.platform }}site",
                platform: "${{ inputs.platform }}",
                repository: "${{ github.repository }}",
                run_id: "${{ github.run_id }}",
                locale: "${{ inputs.locale }}"
              }
            });
