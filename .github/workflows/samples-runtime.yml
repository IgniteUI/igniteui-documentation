name: Samples load check

# Every sample loaded into chromium with the real component renderer and the published
# igniteui-webcomponents-* packages, checked for errors.
#
# The snippet checks prove a definition emits code. They cannot prove the sample it came from works: a
# property can be spelled right, typed right, and still leave a component throwing on load. This is the
# other half, and it is the same script anyone runs locally:
#
#   node docs/xplat/scripts/samples-runtime/run.mjs
#
# The packages come from the registry here, which is what a reader of the documentation installs. A
# local run can point at a locally built set with --packages=<dir> when checking a build before it
# ships.

permissions:
  contents: read

on:
  pull_request:
    branches: [ master, vnext ]
    paths:
      - 'docs/xplat/scripts/samples-runtime/**'
      - '.github/workflows/samples-runtime.yml'
  schedule:
    # Nightly, because what this checks is the published packages against the samples: neither changes
    # because of anything in this repository, and both change without it.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      filter:
        description: 'Only samples whose path contains this'
        required: false
        type: string

jobs:
  load-every-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The library a sample binds to is emitted by the product's own code generating renderer, which
      # ships in dev-tools rather than in a package. Same build the snippet checks use.
      - name: Checkout dev-tools
        uses: actions/checkout@v4
        with:
          repository: Infragistics-Developer-Tools/dev-tools
          path: dev-tools
          token: ${{ secrets.DEV_TOOLS_TOKEN }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build the snippet emitter
        working-directory: dev-tools/XPlatform/Main/Source/DataVisualization.JS/DataVisualization
        run: dotnet build DV.Shared.DESCRIPTION.JS.csproj -c Debug

      - name: Bundle the snippet emitter
        working-directory: dev-tools/XPlatform/Main/Tests/XSharpTesting/SnippetEmitterSpike
        run: |
          npm install --no-audit --no-fund
          node collect-ts.js
          npm run build

      - name: Resolve the examples checkout
        id: examples
        run: |
          node docs/xplat/scripts/ci/resolve-examples.mjs --print-path >> "$GITHUB_OUTPUT"

      - name: Install the harness and chromium
        working-directory: docs/xplat/scripts/samples-runtime
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Load every sample
        working-directory: docs/xplat/scripts/samples-runtime
        env:
          XPLAT_EXAMPLES: ${{ steps.examples.outputs.path }}
          IG_SNIPPET_API: ${{ github.workspace }}/dev-tools/XPlatform/Main/Tests/XSharpTesting/SnippetEmitterSpike/dist/snippet-api.cjs
        run: |
          node run.mjs ${{ inputs.filter && format('--filter={0}', inputs.filter) || '' }}

      - name: Keep what the emitted library looked like
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emitted-library
          path: docs/xplat/scripts/samples-runtime/generated
          if-no-files-found: ignore
          retention-days: 7
