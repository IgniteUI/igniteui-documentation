name: Snippet checks

# What a json-snippet has to survive before a page can ship: the schema the descriptions declare, and
# emission on every platform — including the platforms a page is gated away from, which is where a
# definition breaks unnoticed.
#
# Both jobs run the same scripts anyone runs locally:
#   node docs/xplat/scripts/check-snippet-schema.mjs
#   node docs/xplat/scripts/check-snippet-emission.mjs
#
# Locally those find a peer dev-tools and igniteui-xplat-examples checkout. Here there are none, so
# dev-tools is checked out and its emitter built, and the examples are cloned at the branch matching
# the branch under review — the same matching dev-tools' own builds use.

permissions:
  contents: read

on:
  pull_request:
    branches: [ master, vnext ]
    paths:
      - 'docs/xplat/src/content/**'
      - 'docs/xplat/scripts/**'
      - '.github/workflows/snippet-checks.yml'
  workflow_dispatch:

jobs:
  snippets:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The emitter is the product's own code generating renderer, transpiled to run in node. It ships
      # in dev-tools rather than in a package, so it is built here. Once igniteui-webcomponents-core
      # exports the snippet recorder, this step can be dropped and IG_SNIPPET_API pointed at the
      # installed package instead — lib/snippet-toolchain.mjs already resolves it that way.
      - name: Checkout dev-tools
        uses: actions/checkout@v4
        with:
          repository: Infragistics-Developer-Tools/dev-tools
          path: dev-tools
          token: ${{ secrets.DEV_TOOLS_TOKEN }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build the snippet emitter
        working-directory: dev-tools/XPlatform/Main/Source/DataVisualization.JS/DataVisualization
        run: dotnet build DV.Shared.DESCRIPTION.JS.csproj -c Debug

      - name: Bundle the snippet emitter
        working-directory: dev-tools/XPlatform/Main/Tests/XSharpTesting/SnippetEmitterSpike
        run: |
          npm install --no-audit --no-fund
          node collect-ts.js
          npm run build

      # The samples and the code generation library a snippet is emitted against. Resolved to the
      # examples branch matching this one, so a change spanning both repositories is checked against
      # the samples it was written for.
      - name: Resolve the examples checkout
        id: examples
        run: |
          node docs/xplat/scripts/ci/resolve-examples.mjs --print-path >> "$GITHUB_OUTPUT"

      - name: Check the schema
        env:
          XPLAT_EXAMPLES: ${{ steps.examples.outputs.path }}
          IG_SNIPPET_API: ${{ github.workspace }}/dev-tools/XPlatform/Main/Tests/XSharpTesting/SnippetEmitterSpike/dist/snippet-api.cjs
        run: node docs/xplat/scripts/check-snippet-schema.mjs

      - name: Check emission on every platform
        env:
          XPLAT_EXAMPLES: ${{ steps.examples.outputs.path }}
          IG_SNIPPET_API: ${{ github.workspace }}/dev-tools/XPlatform/Main/Tests/XSharpTesting/SnippetEmitterSpike/dist/snippet-api.cjs
        run: |
          node docs/xplat/scripts/check-snippet-emission.mjs --lang=en
          node docs/xplat/scripts/check-snippet-emission.mjs --lang=jp
