name: CI
permissions:
  contents: read

on:
  pull_request:
    branches: [ master, vnext ]

jobs:
  build-and-verify:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform: ['angular', 'react', 'webcomponents', 'blazor']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # DOCS_TOC_STRICT fails the build when a toc.json entry points at a
      # missing file, instead of silently dropping it from the sidebar.
      - name: Build ${{ matrix.platform }}
        run: npm run xplat:build:${{ matrix.platform }}
        env:
          DOCS_TOC_STRICT: 'true'

      - name: Build Angular Unique
        if: matrix.platform == 'angular'
        run: npm run angular:build
        env:
          DOCS_TOC_STRICT: 'true'
