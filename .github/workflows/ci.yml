name: CI
permissions:
  contents: read

on:
  pull_request:
    branches: [ master, vnext ]

jobs:
  build-and-verify:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform: ['angular', 'react', 'webcomponents', 'blazor']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Generating a topic emits its json-snippet fences, which the product's code generating
      # renderer does — it ships in igniteui-webcomponents-core, so this needs nothing but npm.
      - name: Build the snippet emitter
        working-directory: docs/xplat/scripts/snippet-emitter
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build ${{ matrix.platform }}
        run: npm run xplat:build:${{ matrix.platform }}

      - name: Build Angular Unique
        if: matrix.platform == 'angular'
        run: npm run angular:build
