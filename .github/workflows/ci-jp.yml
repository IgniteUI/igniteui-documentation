# The build of the translated sites a pull request changes. ci.yml builds the
# English only; a page the tool or a reviewer broke in a translation would
# otherwise first fail in that language's deploy after the merge.
#
# Which languages:
#   · a translation pull request (translations/<locale> → vnext,
#     translate-jp-docs.yml; normally translations/ja): its language, from the
#     branch, matched against a fixed list;
#   · any other pull request: each language whose content folder it changes,
#     e.g. the Spanish, Portuguese and Korean pages translate-docs-pr.yml
#     commits to an English pull request.
# Only the sites the change reaches, built as the deploys build them:
# for ja (jp/), es (es/), pt-BR (pt-BR/) and ko (kr/) alike:
#     docs/angular/src/content/<folder>/**  the Angular site
#                                     (npm run angular:build:jp|es|pt-br|kr)
#     docs/xplat/src/content/<folder>/**    every xplat site of that language
#                                     (npm run xplat:build:<site>:jp|es|pt-br|kr),
#                                     plus the Angular site, which carries the
#                                     xplat topics of that language
# In parallel, one job per site, like ci.yml's English matrix.
#
# DOCS_TOC_STRICT is left off, as in the Japanese deploys: whether today's
# translations pass it has not been measured. Turn it on once a run shows they
# do (a translated page missing from its toc.json then fails here).
#
# SECURITY. `pull_request`: the pull request's own code runs, with the
# repository's read-only token and no secrets. Runs once TRANSLATE_ENABLED is
# true. The branch name is never put in a script: it is passed through the
# environment and compared with the known names.

name: CI (docs translations)

on:
  pull_request:
    branches: [vnext]
    paths:
      - 'docs/angular/src/content/jp/**'
      - 'docs/xplat/src/content/jp/**'
      - 'docs/angular/src/content/es/**'
      - 'docs/xplat/src/content/es/**'
      - 'docs/angular/src/content/pt-BR/**'
      - 'docs/xplat/src/content/pt-BR/**'
      - 'docs/angular/src/content/kr/**'
      - 'docs/xplat/src/content/kr/**'

permissions:
  contents: read

concurrency:
  group: ci-docs-translation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sites:
    if: vars.TRANSLATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.sites.outputs.list }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Which sites the change reaches
        id: sites
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The language folders to look at: a translation branch's own, or all.
          case "$HEAD_REF" in
            translations/ja)    folders=(jp) ;;
            translations/es)    folders=(es) ;;
            translations/pt-BR) folders=(pt-BR) ;;
            translations/ko)    folders=(kr) ;;
            translations/*) echo "Not a known translation branch: $(printf '%q' "$HEAD_REF"). Nothing to build."
               echo 'list=[]' >> "$GITHUB_OUTPUT"; exit 0 ;;
            *) folders=(jp es pt-BR kr) ;;
          esac
          changed=$(git diff --name-only "$(git merge-base "$BASE_SHA" HEAD)" HEAD)
          # One entry per build, <folder>:<site>.
          list=()
          for folder in "${folders[@]}"; do
            if grep -q "^docs/xplat/src/content/$folder/" <<< "$changed"; then
              for site in angular react webcomponents blazor winui uno; do list+=("$folder:$site"); done
            elif grep -q "^docs/angular/src/content/$folder/" <<< "$changed"; then
              list+=("$folder:angular")
            fi
          done
          json=$(printf '%s\n' "${list[@]}" | sed '/^$/d' | node -e 'console.log(JSON.stringify(require("fs").readFileSync(0, "utf8").split("\n").filter(Boolean)))')
          echo "list=$json" >> "$GITHUB_OUTPUT"
          echo "Builds: $json"

  build:
    needs: sites
    if: needs.sites.outputs.list != '[]' && needs.sites.outputs.list != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.sites.outputs.list) }}
    name: Build ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # As in ci.yml: generating a topic emits its json-snippet fences.
      - name: Build the snippet emitter
        working-directory: docs/xplat/scripts/snippet-emitter
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build ${{ matrix.build }}
        env:
          BUILD: ${{ matrix.build }}
        run: |
          FOLDER=${BUILD%%:*}; SITE=${BUILD#*:}
          # The scripts' language suffix; both values come from fixed lists.
          case "$FOLDER" in
            jp) suffix=jp ;; es) suffix=es ;; pt-BR) suffix=pt-br ;; kr) suffix=kr ;;
            *) echo "::error::no build for language folder $FOLDER"; exit 1 ;;
          esac
          case "$SITE" in
            angular) npm run "angular:build:$suffix" ;;
            react|webcomponents|blazor|winui|uno) npm run "xplat:build:$SITE:$suffix" ;;
            *) echo "::error::no build for $SITE ($FOLDER)"; exit 1 ;;
          esac
