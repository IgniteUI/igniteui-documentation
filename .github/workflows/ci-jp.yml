# The build, in its language, of what a translation pull request
# (translations/<locale> → vnext, translate-jp-docs.yml) changed. ci.yml builds
# the English only; a page the tool or a reviewer broke in a translation would
# otherwise first fail in that language's deploy after the merge.
#
# The language comes from the pull request's branch, matched against a fixed
# list (translations/ja, translations/es, translations/pt-BR, translations/ko);
# any other branch builds nothing. Only the sites the change reaches, built as
# the deploys build them:
# for ja (jp/), es (es/), pt-BR (pt-BR/) and ko (kr/) alike:
#     docs/angular/src/content/<folder>/**  the Angular site
#                                     (npm run angular:build:jp|es|pt-br|kr)
#     docs/xplat/src/content/<folder>/**    every xplat site of that language
#                                     (npm run xplat:build:<site>:jp|es|pt-br|kr),
#                                     plus the Angular site, which carries the
#                                     xplat topics of that language
# In parallel, one job per site, like ci.yml's English matrix.
#
# DOCS_TOC_STRICT is left off, as in the Japanese deploys: whether today's
# translations pass it has not been measured. Turn it on once a run shows they
# do (a translated page missing from its toc.json then fails here).
#
# SECURITY. `pull_request`: the pull request's own code runs, with the
# repository's read-only token and no secrets. Runs only for the four
# translation branches of this repo, once TRANSLATE_ENABLED is true. The branch
# name is never put in a script: it is passed through the environment and
# compared with the four known names.

name: CI (docs translations)

on:
  pull_request:
    branches: [vnext]
    paths:
      - 'docs/angular/src/content/jp/**'
      - 'docs/xplat/src/content/jp/**'
      - 'docs/angular/src/content/es/**'
      - 'docs/xplat/src/content/es/**'
      - 'docs/angular/src/content/pt-BR/**'
      - 'docs/xplat/src/content/pt-BR/**'
      - 'docs/angular/src/content/kr/**'
      - 'docs/xplat/src/content/kr/**'

permissions:
  contents: read

concurrency:
  group: ci-docs-translation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sites:
    if: >-
      vars.TRANSLATE_ENABLED == 'true' &&
      startsWith(github.event.pull_request.head.ref, 'translations/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      folder: ${{ steps.sites.outputs.folder }}
      list: ${{ steps.sites.outputs.list }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Which sites the change reaches
        id: sites
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$HEAD_REF" in
            translations/ja)    folder=jp ;;
            translations/es)    folder=es ;;
            translations/pt-BR) folder=pt-BR ;;
            translations/ko)    folder=kr ;;
            *) echo "Not a translation branch: $(printf '%q' "$HEAD_REF"). Nothing to build."
               echo "list=[]" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          changed=$(git diff --name-only "$(git merge-base "$BASE_SHA" HEAD)" HEAD)
          list=()
          if grep -q "^docs/xplat/src/content/$folder/" <<< "$changed"; then
            list=(angular react webcomponents blazor winui uno)
          fi
          if [ ${#list[@]} -eq 0 ] && grep -q "^docs/angular/src/content/$folder/" <<< "$changed"; then
            list=(angular)
          fi
          json=$(printf '%s\n' "${list[@]}" | sed '/^$/d' | node -e 'console.log(JSON.stringify(require("fs").readFileSync(0, "utf8").split("\n").filter(Boolean)))')
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
          echo "list=$json" >> "$GITHUB_OUTPUT"
          echo "Builds ($folder): $json"

  build:
    needs: sites
    if: needs.sites.outputs.list != '[]' && needs.sites.outputs.list != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.list) }}
    name: Build ${{ matrix.site }} (${{ needs.sites.outputs.folder }})
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # As in ci.yml: generating a topic emits its json-snippet fences.
      - name: Build the snippet emitter
        working-directory: docs/xplat/scripts/snippet-emitter
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build ${{ matrix.site }} (${{ needs.sites.outputs.folder }})
        env:
          SITE: ${{ matrix.site }}
          FOLDER: ${{ needs.sites.outputs.folder }}
        run: |
          # The scripts' language suffix; both values come from fixed lists.
          case "$FOLDER" in
            jp) suffix=jp ;; es) suffix=es ;; pt-BR) suffix=pt-br ;; kr) suffix=kr ;;
            *) echo "::error::no build for language folder $FOLDER"; exit 1 ;;
          esac
          case "$SITE" in
            angular) npm run "angular:build:$suffix" ;;
            react|webcomponents|blazor|winui|uno) npm run "xplat:build:$SITE:$suffix" ;;
            *) echo "::error::no build for $SITE ($FOLDER)"; exit 1 ;;
          esac
