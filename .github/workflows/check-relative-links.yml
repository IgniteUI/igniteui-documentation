name: Check Relative Links

permissions:
  contents: read

on:
  pull_request:
    branches: [master, vnext]
  push:
    branches: [master, vnext]

jobs:
  check-relative-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Generating a topic emits its json-snippet fences, which the product's code generating
      # renderer does — it ships in igniteui-webcomponents-core, so this needs nothing but npm.
      - name: Build the snippet emitter
        working-directory: docs/xplat/scripts/snippet-emitter
        run: |
          npm install --no-audit --no-fund
          npm run build

      # Generate the xplat Angular overlay into docs/xplat/generated/Angular.
      # The Angular site reads that tree in place (nothing is copied into
      # docs/angular/src/content), and the link checker scans both roots, so
      # the overlay has to exist before scanning — same as the angular build.
      - name: Generate xplat Angular overlay (en)
        run: npm run xplat:generate --prefix docs/angular

      - name: Generate xplat Angular overlay (jp)
        run: npm run xplat:generate:jp --prefix docs/angular

      - name: Generate angular content (en)
        run: npm run generate:en --prefix docs/angular

      - name: Generate angular content (jp)
        run: npm run generate:jp --prefix docs/angular

      # Expand xplat _shared/ templates into docs/xplat/generated/ for all
      # non-Angular platforms so the generated grid pages are present when
      # the xplat link check runs (Angular is already generated by the overlay steps).
      - name: Generate xplat content (en)
        run: |
          npm run generate:react --prefix docs/xplat
          npm run generate:webcomponents --prefix docs/xplat
          npm run generate:blazor --prefix docs/xplat
          npm run generate:winui --prefix docs/xplat
          npm run generate:uno --prefix docs/xplat

      - name: Generate xplat content (jp)
        run: |
          npm run generate:react:jp --prefix docs/xplat
          npm run generate:webcomponents:jp --prefix docs/xplat
          npm run generate:blazor:jp --prefix docs/xplat

      - name: Check relative links
        shell: bash
        run: |
          set -o pipefail

          EXIT=0
          echo '## Relative Link Check' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          node scripts/check-relative-links.mjs --platform=xplat 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || EXIT=1
          node scripts/check-relative-links.mjs --platform=angular 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || EXIT=1

          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $EXIT
